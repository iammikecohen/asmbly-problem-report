<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asmbly Problem Reports</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --surface: #1e2030;
      --surface-hover: #252840;
      --text: #e0e0e0;
      --text-muted: #888;
      --accent: #4a9eff;
      --red: #e74c3c;
      --yellow: #f39c12;
      --green: #2ecc71;
      --border: #2a2d45;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    header h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }

    .updated { font-size: 0.8rem; color: var(--text-muted); }

    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

    /* Landing */
    .workspace-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .workspace-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 1.2rem;
      border-left: 4px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      display: block;
      transition: background 0.15s;
    }

    .workspace-card:hover { background: var(--surface-hover); }
    .workspace-card.has-problems { border-left-color: var(--red); }
    .workspace-card.no-problems { border-left-color: var(--green); }

    .workspace-card .ws-name { font-size: 1rem; font-weight: 600; }

    .workspace-card .ws-count {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin: 0.4rem 0 0.2rem;
    }

    .workspace-card.has-problems .ws-count { color: var(--red); }
    .workspace-card.no-problems .ws-count { color: var(--green); }

    .workspace-card .ws-label { font-size: 0.75rem; color: var(--text-muted); }

    /* Workspace detail */
    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 1rem;
    }

    .back-link:hover { text-decoration: underline; }

    .workspace-heading {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .workspace-heading h2 { margin: 0; font-size: 1.5rem; }

    /* Badges */
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-red    { background: rgba(231,76,60,0.15);  color: var(--red); }
    .badge-yellow { background: rgba(243,156,18,0.15); color: var(--yellow); }
    .badge-green  { background: rgba(46,204,113,0.15); color: var(--green); }
    .badge-muted  { background: rgba(255,255,255,0.08); color: var(--text-muted); }

    /* Status filters */
    .status-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }

    .filter-btn {
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .filter-btn.f-red    { background: rgba(231,76,60,0.15);  color: var(--red);        border-color: rgba(231,76,60,0.3); }
    .filter-btn.f-yellow { background: rgba(243,156,18,0.15); color: var(--yellow);     border-color: rgba(243,156,18,0.3); }
    .filter-btn.f-muted  { background: rgba(255,255,255,0.08); color: var(--text-muted); border-color: var(--border); }
    .filter-btn.f-inactive { background: transparent; color: var(--text-muted); border-color: var(--border); opacity: 0.35; }

    /* Equipment group */
    .equipment-group { margin-bottom: 1.75rem; }

    .equipment-group > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    .equipment-group > summary::-webkit-details-marker { display: none; }
    .equipment-group > summary:hover { color: var(--text); }

    .equip-label { display: flex; align-items: center; gap: 0.4em; flex: 1; }

    .equip-chevron { display: inline-block; transition: transform 0.15s; }
    .equipment-group[open] > summary .equip-chevron { transform: rotate(90deg); }

    .problem-card {
      background: var(--surface);
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .problem-card > summary {
      list-style: none;
      cursor: pointer;
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      user-select: none;
      border-radius: 6px;
    }
    .problem-card > summary::-webkit-details-marker { display: none; }
    .problem-card > summary:hover { background: var(--surface-hover); }
    .problem-card[open] > summary { border-radius: 6px 6px 0 0; }

    .card-chevron {
      display: inline-block;
      transition: transform 0.15s;
      color: var(--text-muted);
      font-size: 0.7em;
      margin-right: 0.35em;
      flex-shrink: 0;
      align-self: center;
    }
    .problem-card[open] > summary .card-chevron { transform: rotate(90deg); }

    .problem-summary { font-size: 0.9rem; flex: 1; }

    .problem-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .problem-meta a {
      color: var(--accent);
      font-size: 0.8rem;
      text-decoration: none;
    }

    .problem-meta a:hover { text-decoration: underline; }

    .problem-description {
      padding: 0.75rem 1rem 0.9rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: pre-wrap;
      font-family: inherit;
      line-height: 1.5;
    }

    .empty-state, .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Asmbly Problem Reports</h1>
    <span class="updated" id="updated-time"></span>
  </header>
  <main id="app">
    <div class="loading">Loading...</div>
  </main>
  <footer id="footer"></footer>

  <script>
    let data = null;
    let currentSlug = null;
    let activeStatuses = null;

    // ── Utilities ──────────────────────────────────────────────

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function relativeTime(iso) {
      const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
      if (diff < 1) return 'Updated just now';
      if (diff === 1) return 'Updated 1 minute ago';
      return `Updated ${diff} minutes ago`;
    }

    function groupBy(arr, key) {
      return arr.reduce((acc, item) => {
        const k = item[key] || 'Unknown';
        (acc[k] = acc[k] || []).push(item);
        return acc;
      }, {});
    }

    function statusBadgeClass(status) {
      const s = (status || '').toLowerCase();
      if (s === 'open') return 'badge-red';
      if (s.includes('progress') || s.includes('review')) return 'badge-yellow';
      return 'badge-muted';
    }

    function statusFilterClass(status) {
      const s = (status || '').toLowerCase();
      if (s === 'open') return 'f-red';
      if (s.includes('progress') || s.includes('review')) return 'f-yellow';
      return 'f-muted';
    }

    function safeUrl(url) {
      return (typeof url === 'string' && url.startsWith('https://')) ? url : null;
    }

    // ── Rendering ─────────────────────────────────────────────

    function renderLanding() {
      const byWorkspace = groupBy(data.tasks, 'workspace');
      const sorted = Object.entries(byWorkspace)
        .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));

      if (sorted.length === 0) {
        document.getElementById('app').innerHTML =
          '<div class="empty-state">No open problems reported.</div>';
        return;
      }

      const cards = sorted.map(([name, tasks]) => {
        const slug = tasks[0]?.workspace_slug || '';
        const count = tasks.length;
        const cls = count > 0 ? 'has-problems' : 'no-problems';
        const label = count === 1 ? 'open problem' : 'open problems';
        return `<a class="workspace-card ${cls}" href="#${slug}">
          <div class="ws-name">${esc(name)}</div>
          <div class="ws-count">${count}</div>
          <div class="ws-label">${label}</div>
        </a>`;
      }).join('');

      document.getElementById('app').innerHTML =
        `<div class="workspace-grid">${cards}</div>`;
    }

    function renderWorkspace(slug) {
      if (slug !== currentSlug) {
        currentSlug = slug;
        activeStatuses = null;
      }

      const tasks = data.tasks.filter(t => t.workspace_slug === slug);
      const name = tasks[0]?.workspace || slug;
      const back = `<a class="back-link" href="#">← All Workspaces</a>`;

      if (tasks.length === 0) {
        document.getElementById('app').innerHTML =
          `${back}<div class="empty-state">No open problems in this workspace.</div>`;
        return;
      }

      const allStatuses = [...new Set(tasks.map(t => t.status))].sort();
      if (!activeStatuses) activeStatuses = new Set(allStatuses);

      const filterButtons = allStatuses.map(s => {
        const cls = activeStatuses.has(s) ? statusFilterClass(s) : 'f-inactive';
        return `<button class="filter-btn ${cls}" data-status="${esc(s)}">${esc(s)}</button>`;
      }).join('');
      const filters = `<div class="status-filters">${filterButtons}</div>`;

      const filteredTasks = tasks.filter(t => activeStatuses.has(t.status));
      const countBadge = `<span class="badge badge-red">${filteredTasks.length} open</span>`;
      const heading = `<div class="workspace-heading">
        <h2>${esc(name)}</h2>${countBadge}
      </div>`;

      let groupsHtml;
      if (filteredTasks.length === 0) {
        groupsHtml = '<div class="empty-state">No problems match the selected filters.</div>';
      } else {
        const byEquipment = groupBy(filteredTasks, 'equipment');
        groupsHtml = Object.entries(byEquipment).map(([equip, problems]) => {
          const cards = problems.map(t => {
            const links = [
              safeUrl(t.discourse_url)
                ? `<a href="${esc(t.discourse_url)}" target="_blank" rel="noopener">Discourse ↗</a>`
                : '',
              safeUrl(t.slack_url)
                ? `<a href="${esc(t.slack_url)}" target="_blank" rel="noopener">Slack ↗</a>`
                : '',
            ].filter(Boolean).join('');

            const descHtml = t.description
              ? `<div class="problem-description">${esc(t.description)}</div>`
              : '';
            return `<details class="problem-card">
              <summary>
                <span class="card-chevron">▶</span>
                <div class="problem-summary">${esc(t.summary)}</div>
                <div class="problem-meta">
                  <span class="badge ${statusBadgeClass(t.status)}">${esc(t.status)}</span>
                  ${links}
                </div>
              </summary>
              ${descHtml}
            </details>`;
          }).join('');

          return `<details class="equipment-group" open>
            <summary>
              <span class="equip-label">
                <span class="equip-chevron">▶</span>
                ${esc(equip)}
              </span>
              <span class="badge badge-muted">${problems.length}</span>
            </summary>
            ${cards}
          </details>`;
        }).join('');
      }

      document.getElementById('app').innerHTML = `${back}${heading}${filters}${groupsHtml}`;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = btn.dataset.status;
          activeStatuses.has(s) ? activeStatuses.delete(s) : activeStatuses.add(s);
          renderWorkspace(slug);
        });
      });
    }

    // ── Routing ───────────────────────────────────────────────

    function render() {
      if (!data) return;
      const slug = window.location.hash.slice(1);
      slug ? renderWorkspace(slug) : renderLanding();
    }

    // ── Bootstrap ─────────────────────────────────────────────

    async function init() {
      const res = await fetch('./data.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();

      const timeText = relativeTime(data.updated);
      document.getElementById('updated-time').textContent = timeText;
      document.getElementById('footer').textContent = timeText;

      render();
    }

    window.addEventListener('hashchange', render);

    init().catch(err => {
      document.getElementById('app').innerHTML =
        `<div class="empty-state">Failed to load data: ${esc(err.message)}</div>`;
    });
  </script>
</body>
</html>
